<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Degradado claro únicamente en el borde afilado convexo -->
    <linearGradient id="axeBladeEdge" x1="87" y1="45" x2="104" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c96b36"/>
      <stop offset="48%" stop-color="#e5975b"/>
      <stop offset="85%" stop-color="#f7c492"/>
      <stop offset="100%" stop-color="#ffe7cc"/>
    </linearGradient>
  </defs>
  <!-- Hacha de cobre compacta con cuello estrecho y filo curvo convexo sin estirarse hacia arriba -->
  <ellipse cx="64" cy="109" rx="34" ry="7.5" fill="#18130e" opacity="0.22"/>
  <!-- Mango de madera curvado -->
  <path d="M22 105 C39 86 56 64 74 38" fill="none" stroke="#1e1813" stroke-width="15" stroke-linecap="round"/>
  <path d="M22 105 C39 86 56 64 74 38" fill="none" stroke="#8a5a34" stroke-width="9" stroke-linecap="round"/>
  <path d="M40 85 C51 72 60 59 70 46" fill="none" stroke="#b37f52" stroke-width="2.6" stroke-linecap="round" opacity="0.78"/>
  <!-- Empuñadura de cuero -->
  <path d="M22 105 C28 98 34 91 40 83" fill="none" stroke="#4a2c19" stroke-width="9.4" stroke-linecap="round"/>
  <path d="M25 96 L31 101 M30 89 L37 94 M36 83 L42 87" stroke="#22140b" stroke-width="2" stroke-linecap="round"/>
  <!-- Cabeza metálica compacta: maza trasera + cuello estrecho + ensanche hacia filo convexo -->
  <path d="M62 41 L69 32 C76 37 85 38 97 37 C106 45 103 59 89 66 C84 55 77 49 69 47 Z" fill="#c96b36" stroke="#1e1813" stroke-width="4.4" stroke-linejoin="round"/>
  <!-- Degradado claro aplicado únicamente sobre el borde afilado convexo -->
  <path d="M95 39 C103 46 101 58 89 63 C92 54 92 45 90 39 Z" fill="url(#axeBladeEdge)"/>
  <!-- Sombra forjada en el cuello estrecho -->
  <path d="M74 42 C78 44 82 46 86 52 C81 48 77 46 72 45 Z" fill="#9c4820" opacity="0.65"/>
  <!-- Collarín sujetado al mango -->
  <path d="M65 39 L72 31 L80 38 L73 47 Z" fill="#8f401c" stroke="#1e1813" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="72.5" cy="39" r="1.9" fill="#eab584"/>
</svg>
