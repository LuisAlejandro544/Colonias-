<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Azada de cobre con hoja plana y estrecha perpendicular (90°) desde la punta del mango y leve curva hacia abajo -->
  <ellipse cx="64" cy="109" rx="34" ry="7.5" fill="#18130e" opacity="0.22"/>
  <!-- Mango largo de fresno hasta la punta superior (75, 41) -->
  <path d="M22 105 L75 41" fill="none" stroke="#1e1813" stroke-width="14.5" stroke-linecap="round"/>
  <path d="M22 105 L75 41" fill="none" stroke="#8a5a34" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M40 84 L69 49" fill="none" stroke="#b37f52" stroke-width="2.6" stroke-linecap="round" opacity="0.78"/>
  <!-- Empuñadura de cuero -->
  <path d="M22 105 L37 87" fill="none" stroke="#4a2c19" stroke-width="9" stroke-linecap="round"/>
  <path d="M25 96 L31 101 M30 89 L37 94" stroke="#22140b" stroke-width="2" stroke-linecap="round"/>
  <!-- Hoja plana y estrecha que sobresale a 90° desde la punta superior con leve curva hacia abajo -->
  <path d="M76 34 L97 51 C103 56 106 60 107 65 L98 69 C96 64 93 61 88 57 L71 43 Z" fill="#c96b36" stroke="#1e1813" stroke-width="4.2" stroke-linejoin="round"/>
  <!-- Lomo superior iluminado y filo claro en la punta de la hoja estrecha -->
  <path d="M77 37 L96 52 C100 56 103 59 104 63" fill="none" stroke="#f0ab73" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M98 66 L105 63" stroke="#ffe4c4" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Casquillo sujeto en la punta superior del mango -->
  <path d="M67 42 L74 33 L82 40 L75 49 Z" fill="#8f401c" stroke="#1e1813" stroke-width="3.2" stroke-linejoin="round"/>
  <circle cx="74.5" cy="41" r="2" fill="#eab584"/>
</svg>
