<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Mesa de Masón 2.5D estilo RimWorld: tablero de piedra, cincel, mazo y ladrillos de piedra -->
  <ellipse cx="64" cy="108" rx="54" ry="12" fill="#18130e" opacity="0.34"/>
  <!-- Soportes gruesos de mampostería -->
  <rect x="18" y="66" width="18" height="38" rx="2" fill="#6a645b" stroke="#1e1813" stroke-width="3.6"/>
  <rect x="92" y="66" width="18" height="38" rx="2" fill="#6a645b" stroke="#1e1813" stroke-width="3.6"/>
  <rect x="34" y="82" width="60" height="12" rx="2" fill="#817a70" stroke="#1e1813" stroke-width="3.2"/>
  <path d="M54 82 L54 94 M74 82 L74 94" stroke="#4a453e" stroke-width="2.2"/>
  <!-- Frente del bloque de mesa -->
  <rect x="12" y="54" width="104" height="20" rx="3" fill="#5f5951" stroke="#1e1813" stroke-width="4"/>
  <path d="M44 54 L44 74 M84 54 L84 74" stroke="#3f3a34" stroke-width="2.4"/>
  <!-- Superficie superior de losa de piedra -->
  <rect x="12" y="30" width="104" height="30" rx="4" fill="#969086" stroke="#1e1813" stroke-width="4"/>
  <path d="M18 38 L52 38 M72 52 L108 52" stroke="#b3aca1" stroke-width="2.2" stroke-linecap="round" opacity="0.72"/>
  <!-- Ladrillo de piedra tallándose sobre la mesa -->
  <polygon points="22,42 36,34 62,38 62,51 48,57 22,53" fill="#7f796f" stroke="#1e1813" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="22,42 36,34 62,38 48,46" fill="#b4ada1" stroke="#1e1813" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="48,46 62,38 62,51 48,57" fill="#635d55"/>
  <path d="M35 39 L50 42" stroke="#d2cbc0" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <!-- Cincel metálico -->
  <path d="M70 40 L94 34 L97 40 L73 46 Z" fill="#b2bbc4" stroke="#1e1813" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M64 41 L71 39 L73 46 L66 48 Z" fill="#8b5a34" stroke="#1e1813" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Mazo de cantero -->
  <rect x="78" y="48" width="26" height="8" rx="2" fill="#8c5a34" stroke="#1e1813" stroke-width="2.6"/>
  <rect x="92" y="42" width="14" height="20" rx="3" fill="#7c766d" stroke="#1e1813" stroke-width="3"/>
  <!-- Esquirlas de piedra en el suelo -->
  <polygon points="48,101 54,97 58,103 50,105" fill="#9c968b" stroke="#1e1813" stroke-width="1.8"/>
  <polygon points="72,102 78,99 82,104 74,106" fill="#7d776d" stroke="#1e1813" stroke-width="1.8"/>
</svg>
