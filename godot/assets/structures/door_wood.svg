<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Puerta de madera puesta/instalada en el muro (0..128) -->
  <!-- Umbral inferior de piedra/tierra batida bajo la puerta -->
  <rect x="0" y="88" width="128" height="40" fill="#52463a"/>
  <rect x="0" y="88" width="128" height="8" fill="#6e5e4e"/>
  <!-- Pilares del marco que conectan con muros laterales -->
  <rect x="0" y="0" width="24" height="128" fill="#704829" stroke="#1e1813" stroke-width="4"/>
  <rect x="104" y="0" width="24" height="128" fill="#704829" stroke="#1e1813" stroke-width="4"/>
  <!-- Dintel superior del marco -->
  <rect x="0" y="0" width="128" height="24" fill="#8e5d38" stroke="#1e1813" stroke-width="4"/>
  <!-- Hoja de la puerta instalada dentro del marco -->
  <rect x="24" y="20" width="80" height="90" fill="#a87549" stroke="#1e1813" stroke-width="4"/>
  <!-- Tablones verticales de la puerta -->
  <path d="M44 20 L44 110 M64 20 L64 110 M84 20 L84 110" stroke="#6b4426" stroke-width="2.8"/>
  <!-- Travesaños horizontales reforzados -->
  <rect x="24" y="34" width="80" height="11" fill="#8c5c36" stroke="#1e1813" stroke-width="3"/>
  <rect x="24" y="84" width="80" height="11" fill="#8c5c36" stroke="#1e1813" stroke-width="3"/>
  <!-- Bisagras de hierro a la izquierda -->
  <rect x="22" y="36" width="18" height="7" rx="2" fill="#4f565e" stroke="#1e1813" stroke-width="2.4"/>
  <rect x="22" y="86" width="18" height="7" rx="2" fill="#4f565e" stroke="#1e1813" stroke-width="2.4"/>
  <!-- Picaporte y placa de cobre a la derecha -->
  <rect x="88" y="56" width="10" height="18" rx="3" fill="#c98647" stroke="#1e1813" stroke-width="2.4"/>
  <circle cx="93" cy="65" r="4.5" fill="#e6a763" stroke="#1e1813" stroke-width="2.2"/>
</svg>
