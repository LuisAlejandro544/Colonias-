<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Suelo pavimentado de ladrillos de piedra y mortero (transitable, encaja sin cortes entre casillas) -->
  <rect x="0" y="0" width="128" height="128" fill="#534d45"/>
  <!-- Fila 1 de ladrillos de piedra -->
  <rect x="3" y="3" width="58" height="26" rx="3" fill="#8b8479" stroke="#3c3731" stroke-width="2.2"/>
  <rect x="67" y="3" width="58" height="26" rx="3" fill="#7f796f" stroke="#3c3731" stroke-width="2.2"/>
  <!-- Fila 2 desplazada -->
  <rect x="3" y="35" width="26" height="26" rx="3" fill="#787268" stroke="#3c3731" stroke-width="2.2"/>
  <rect x="35" y="35" width="58" height="26" rx="3" fill="#989185" stroke="#3c3731" stroke-width="2.2"/>
  <rect x="99" y="35" width="26" height="26" rx="3" fill="#857e73" stroke="#3c3731" stroke-width="2.2"/>
  <!-- Fila 3 -->
  <rect x="3" y="67" width="58" height="26" rx="3" fill="#827b70" stroke="#3c3731" stroke-width="2.2"/>
  <rect x="67" y="67" width="58" height="26" rx="3" fill="#918a7e" stroke="#3c3731" stroke-width="2.2"/>
  <!-- Fila 4 desplazada -->
  <rect x="3" y="99" width="26" height="26" rx="3" fill="#8b8479" stroke="#3c3731" stroke-width="2.2"/>
  <rect x="35" y="99" width="58" height="26" rx="3" fill="#7a746a" stroke="#3c3731" stroke-width="2.2"/>
  <rect x="99" y="99" width="26" height="26" rx="3" fill="#958e82" stroke="#3c3731" stroke-width="2.2"/>
  <!-- Biseles suaves de piedra labrada en bordes superiores -->
  <path d="M8 8 L54 8 M72 8 L118 8 M40 40 L86 40 M8 72 L54 72 M72 72 L118 72 M40 104 L86 104" stroke="#bcb5a8" stroke-width="2" stroke-linecap="round" opacity="0.58"/>
</svg>
