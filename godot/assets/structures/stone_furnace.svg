<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Horno de Piedra y Ladrillos de Piedra 2.5D estilo RimWorld con boca de fuego y chimenea -->
  <ellipse cx="64" cy="109" rx="48" ry="13" fill="#18130e" opacity="0.36"/>
  <!-- Chimenea superior de ladrillos de piedra -->
  <rect x="48" y="14" width="32" height="26" rx="3" fill="#7d776d" stroke="#1e1813" stroke-width="3.8"/>
  <path d="M48 26 L80 26 M64 18 L64 26" stroke="#4d4841" stroke-width="2.2"/>
  <ellipse cx="64" cy="14" rx="16" ry="5.5" fill="#968f84" stroke="#1e1813" stroke-width="3.4"/>
  <ellipse cx="64" cy="14" rx="10" ry="3.2" fill="#231c18"/>
  <!-- Humo suave estilizado -->
  <circle cx="62" cy="7" r="4" fill="#d9d1c5" opacity="0.55"/>
  <circle cx="71" cy="5" r="3" fill="#d9d1c5" opacity="0.40"/>
