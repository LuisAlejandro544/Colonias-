  <path d="M22 68 C22 30 106 30 106 68 L108 102 C108 110 20 110 20 102 Z" fill="#8e877c" stroke="#1e1813" stroke-width="4" stroke-linejoin="round"/>
  <!-- Reflejo de hilada superior -->
  <path d="M36 46 C50 40 78 40 92 46" fill="none" stroke="#b5aea2" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
  <!-- Juntas de ladrillos de piedra en cúpula -->
  <path d="M28 56 C46 62 82 62 100 56 M24 72 C46 78 82 78 104 72" fill="none" stroke="#544e47" stroke-width="2.6"/>
  <path d="M46 42 L46 58 M78 42 L78 58 M64 59 L64 75 M36 59 L36 73 M92 59 L92 73" stroke="#544e47" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Base de sillares de piedra oscura -->
  <path d="M18 78 L110 78 L108 104 C108 111 20 111 20 104 Z" fill="#635d55" stroke="#1e1813" stroke-width="3.8" stroke-linejoin="round"/>
  <path d="M20 92 L108 92 M40 78 L40 92 M88 78 L88 92 M30 92 L30 107 M98 92 L98 107" stroke="#3f3b35" stroke-width="2.5"/>
  <!-- Arco de ladrillos de piedra y boca encendida del horno -->
  <path d="M44 107 L44 82 C44 68 84 68 84 82 L84 107 Z" fill="#777167" stroke="#1e1813" stroke-width="3.6" stroke-linejoin="round"/>
  <path d="M45 84 L51 84 M77 84 L83 84 M54 73 L57 79 M74 73 L71 79" stroke="#45403a" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M51 107 L51 85 C51 75 77 75 77 85 L77 107 Z" fill="#2c1912" stroke="#1e1813" stroke-width="3" stroke-linejoin="round"/>
  <!-- Brasas y llama interior -->
  <path d="M53 106 L55 96 L64 82 L73 96 L75 106 Z" fill="#e86c1f"/>
  <path d="M57 106 L64 90 L71 106 Z" fill="#ffd257"/>
  <!-- Carbón y cobre esperando junto al horno -->
  <circle cx="28" cy="106" r="5" fill="#292726" stroke="#1e1813" stroke-width="2.2"/>
  <circle cx="99" cy="105" r="5.5" fill="#d97538" stroke="#1e1813" stroke-width="2.2"/>
</svg>
