  <ellipse cx="64" cy="62" rx="44" ry="20" fill="#9a9388" stroke="#1e1813" stroke-width="4"/>
  <!-- Surcos radiales de molienda -->
  <path d="M64 44 L64 52 M64 72 L64 80 M24 62 L42 62 M86 62 L104 62 M34 50 L48 56 M80 68 L94 74 M94 50 L80 56 M48 68 L34 74" stroke="#6d675e" stroke-width="2.6" stroke-linecap="round"/>
