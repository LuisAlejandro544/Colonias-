<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Pila ordenada de tablones de madera procesada en el piso -->
  <ellipse cx="64" cy="99" rx="46" ry="13" fill="#18130e" opacity="0.30"/>
  <!-- Capa inferior de tablones -->
  <polygon points="18,76 86,58 110,70 42,88" fill="#a87649" stroke="#1e1813" stroke-width="3.8" stroke-linejoin="round"/>
  <polygon points="18,76 42,88 42,98 18,86" fill="#7c5330" stroke="#1e1813" stroke-width="3.6" stroke-linejoin="round"/>
  <polygon points="42,88 110,70 110,80 42,98" fill="#8f6139" stroke="#1e1813" stroke-width="3.6" stroke-linejoin="round"/>
  <!-- Tablón medio -->
  <polygon points="22,60 88,43 108,54 42,71" fill="#be8a59" stroke="#1e1813" stroke-width="3.8" stroke-linejoin="round"/>
  <polygon points="22,60 42,71 42,80 22,69" fill="#895c36" stroke="#1e1813" stroke-width="3.4" stroke-linejoin="round"/>
  <polygon points="42,71 108,54 108,63 42,80" fill="#9c6b41" stroke="#1e1813" stroke-width="3.4" stroke-linejoin="round"/>
  <!-- Tablón superior iluminado -->
  <polygon points="24,44 88,28 106,38 42,54" fill="#d3a16e" stroke="#1e1813" stroke-width="3.8" stroke-linejoin="round"/>
  <polygon points="24,44 42,54 42,63 24,53" fill="#94653c" stroke="#1e1813" stroke-width="3.4" stroke-linejoin="round"/>
  <polygon points="42,54 106,38 106,47 42,63" fill="#ab774a" stroke="#1e1813" stroke-width="3.4" stroke-linejoin="round"/>
  <!-- Vetas suaves en los tablones -->
  <path d="M40 43 L86 32 M44 49 L92 37" stroke="#ab7a4c" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>
</svg>
