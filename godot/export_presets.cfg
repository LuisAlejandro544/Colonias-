; Preajustes de exportación Android separados por arquitectura (64 bits y 32 bits).
;
; Lógica: Define dos presets independientes (`Android-arm64-v8a` y
; `Android-armeabi-v7a`) para generar APKs individuales por arquitectura en
; formato `.apk` directo (sin `.aab` de Google Play ni Gradle custom build).
; Excluye `bin/linux/*` para no empaquetar el binario anfitrión dentro del APK.

[preset.0]

name="Android-arm64-v8a"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="bin/linux/*,bin/armv7/*"
export_path="../build/colonia_centinela-arm64-v8a-debug.apk"
encryption_include_filter=""
encryption_exclude_filter=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=0

