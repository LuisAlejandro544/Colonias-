# Configuración de la cadena de herramientas de Rust (Toolchain).
#
# Lógica: Fija la versión estable más reciente de Rust (1.100.0) y declara
# los targets de compilación cruzada para Android de 64 bits (aarch64) y
# 32 bits (armv7), asegurando compatibilidad total en teléfonos modernos y antiguos.

[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
targets = [
  "aarch64-linux-android",
  "armv7-linux-androideabi",
]
