# Manifiesto principal de la librería nativa en Rust (GDExtension) para Godot 4.7.2.
#
# Lógica: Compila `colonia_core` como librería dinámica C (`cdylib` -> `.so`) para
# enlazarse con Godot en Android (ARM64 y ARMv7). Utiliza `godot` (gdext 0.5.6)
# con el feature `api-4-7` para generar los bindings exactos de Godot 4.7.

[package]
name = "colonia_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
description = "Núcleo lógico modular en Rust para Colonia Centinela (Godot 4.7.2 móvil)."

[lib]
# cdylib genera los binarios `.so` que carga Godot mediante `.gdextension`.
crate-type = ["cdylib"]

[dependencies]
# godot-rust (gdext) última versión estable 0.5.6 apuntando al API de Godot 4.7.
godot = { version = "0.5.6", features = ["api-4-7"] }

[profile.release]
# Optimización enfocada en rendimiento estable en dispositivos móviles.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
